camera:
  index: 0
  width: 640
  height: 480
  buffer_size: 1          # keep at 1 — avoids showing stale frames (lag)

tracker:
  max_num_hands: 1
  min_detection_confidence: 0.7
  min_hand_presence_confidence: 0.7
  min_tracking_confidence: 0.7

pointer:
  ema_alpha: 0.35         # higher = snappier, lower = smoother
  dead_zone_px: 5         # ignore tiny movements
  max_jump_ratio: 0.10    # drop frame if cursor jumps > 10% of screen
  require_index_extended: true

click:
  pinch_on: 0.06          # normalized distance — fingers "touching"
  pinch_off: 0.06         # must open wider than this to re-arm (hysteresis)
  stable_frames: 4        # pinch must hold this many frames before click
  cooldown_ms: 400        # block repeat clicks

display:
  mirror: true            # flip horizontally so movement feels natural
  show_landmarks: true
